apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: restauranty-staging

resources:
- ../../base
- namespace.yaml
- auth-hpa.yaml
- discounts-hpa.yaml
- items-hpa.yaml
- client-hpa.yaml

images:
- name: restaurantyacrfatemeh.azurecr.io/restauranty-auth
  newName: restaurantyacrfatemeh.azurecr.io/restauranty-auth
  newTag: 79cd1cb
- name: restaurantyacrfatemeh.azurecr.io/restauranty-client
  newName: restaurantyacrfatemeh.azurecr.io/restauranty-client
  newTag: staging-79cd1cb
- name: restaurantyacrfatemeh.azurecr.io/restauranty-discounts
  newName: restaurantyacrfatemeh.azurecr.io/restauranty-discounts
  newTag: 79cd1cb
- name: restaurantyacrfatemeh.azurecr.io/restauranty-items
  newName: restaurantyacrfatemeh.azurecr.io/restauranty-items
  newTag: 79cd1cb
    
patches:
- path: patches/auth-deployment.yaml
- path: patches/discounts-deployment.yaml
- path: patches/items-deployment.yaml
- path: patches/client-deployment.yaml
- path: patches/ingress.yaml
  target:
    kind: Ingress
    name: restauranty-ingress
