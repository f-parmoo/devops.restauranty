apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: fatemehparmoo/restauranty-auth:2ed3b0a
          imagePullPolicy: Always
          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: restauranty-configmap
                  key: MONGODB_URI

            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: restauranty-secret
                  key: SECRET

          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP