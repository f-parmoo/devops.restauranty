apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-deployment
  labels:
    app: items
spec:
  replicas: 1
  selector:
    matchLabels:
      app: items
  template:
    metadata:
      labels:
        app: items
    spec:
      containers:
        - name: items
          image: fatemehparmoo/restauranty-items:2ed3b0a
          imagePullPolicy: Always
          ports:
            - containerPort: 3003

          env:
            - name: PORT
              value: "3003"

            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: restauranty-configmap
                  key: MONGODB_URI

            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: restauranty-secret
                  key: SECRET

            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: restauranty-secret
                  key: CLOUD_NAME

            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: restauranty-secret
                  key: CLOUD_API_KEY

            - name: CLOUD_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: restauranty-secret
                  key: CLOUD_API_SECRET

          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: items-service
spec:
  selector:
    app: items
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3003
  type: ClusterIP