apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: restauranty-mongodb-alerts
  namespace: monitoring
  labels:
    release: prometheus

spec:
  groups:
    - name: restauranty.mongodb.rules
      rules:
        - alert: MongoDBDisconnected
          expr: |
            avg by (namespace) (
              mongo_connection_status{
                namespace=~"restauranty-staging|restauranty-production"
              }
            ) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "MongoDB disconnected in {{ $labels.namespace }}"
            description: "MongoDB connection has been down for more than 1 minute."