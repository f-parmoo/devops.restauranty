name: Continuous Integration

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      items: ${{ steps.filter.outputs.items }}
      discounts: ${{ steps.filter.outputs.discounts }}
      client: ${{ steps.filter.outputs.client }}
      k8s: ${{ steps.filter.outputs.k8s }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth/**'

            items:
              - 'backend/items/**'

            discounts:
              - 'backend/discounts/**'

            client:
              - 'client/**'

            k8s:
              - 'k8s/**'
              - 'infra/**'
              - 'deploy.sh'
              - '.github/workflows/**'

  auth-ci:
    name: Auth CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'

    defaults:
      run:
        working-directory: backend/auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: docker build -t auth-ci .

  items-ci:
    name: Items CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.items == 'true'

    defaults:
      run:
        working-directory: backend/items

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: docker build -t items-ci .

  discounts-ci:
    name: Discounts CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.discounts == 'true'

    defaults:
      run:
        working-directory: backend/discounts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: docker build -t discounts-ci .

  client-ci:
    name: Client CI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: docker build -t client-ci .

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - run: kubectl kustomize k8s/overlays/staging
      - run: kubectl kustomize k8s/overlays/production

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - auth-ci
      - items-ci
      - discounts-ci
      - client-ci
      - validate-k8s
    if: always()

    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.auth-ci.result }}" == "failure" || \
                "${{ needs.items-ci.result }}" == "failure" || \
                "${{ needs.discounts-ci.result }}" == "failure" || \
                "${{ needs.client-ci.result }}" == "failure" || \
                "${{ needs.validate-k8s.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi

          echo "CI passed"