name: Continuous Delivery

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

env:
  ACR_NAME: restaurantyacrfatemeh
  DOCKER_REGISTRY: restaurantyacrfatemeh.azurecr.io
  IMAGE_PREFIX: restauranty

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      items: ${{ steps.filter.outputs.items }}
      discounts: ${{ steps.filter.outputs.discounts }}
      client: ${{ steps.filter.outputs.client }}
      k8s: ${{ steps.filter.outputs.k8s }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth/**'

            items:
              - 'backend/items/**'

            discounts:
              - 'backend/discounts/**'

            client:
              - 'client/**'

            k8s:
              - 'k8s/**'
              - 'infra/**'
              - 'deploy.sh'
              - '.github/workflows/**'

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: detect-changes

    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #############################################
      # BUILD & PUSH AUTH
      #############################################

      - name: Build and push auth image
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./backend/auth
          file: ./backend/auth/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth:${{ steps.vars.outputs.sha_short }}      
      #############################################
      # BUILD & PUSH ITEMS
      #############################################

      - name: Build and push items image
        if: needs.detect-changes.outputs.items == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./backend/items
          file: ./backend/items/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-items:${{ steps.vars.outputs.sha_short }}

      #############################################
      # BUILD & PUSH DISCOUNTS
      #############################################

      - name: Build and push discounts image
        if: needs.detect-changes.outputs.discounts == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: ./backend/discounts
          file: ./backend/discounts/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-discounts:${{ steps.vars.outputs.sha_short }}

      #############################################
      # BUILD & PUSH CLIENT
      #############################################

      - name: Build and push client staging image
        if: env.ENVIRONMENT == 'staging' && (needs.detect-changes.outputs.client == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            REACT_APP_SERVER_URL=https://staging.restauranty.codewithfatemeh.online
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:staging-${{ steps.vars.outputs.sha_short }}

      - name: Build and push client production image
        if: env.ENVIRONMENT == 'production' && (needs.detect-changes.outputs.client == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            REACT_APP_SERVER_URL=https://restauranty.codewithfatemeh.online
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-client:prod-${{ steps.vars.outputs.sha_short }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_NAME }} \
            --overwrite-existing

      - name: Verify cluster access
        run: kubectl get nodes


      #############################################
      # CREATE NAMESPACE
      #############################################

      - name: Create namespace
        run: |
          kubectl create namespace restauranty-$ENVIRONMENT \
            --dry-run=client -o yaml | kubectl apply -f -

      #############################################
      # CREATE KUBERNETES SECRET
      #############################################

      - name: Create Kubernetes secret
        run: |
          kubectl create secret generic restauranty-secret \
            --from-literal=SECRET="${{ secrets.SECRET }}" \
            --from-literal=CLOUD_NAME="${{ secrets.CLOUD_NAME }}" \
            --from-literal=CLOUD_API_KEY="${{ secrets.CLOUD_API_KEY }}" \
            --from-literal=CLOUD_API_SECRET="${{ secrets.CLOUD_API_SECRET }}" \
            -n restauranty-$ENVIRONMENT \
            --dry-run=client -o yaml | kubectl apply -f -

      #############################################
      # UPDATE IMAGE TAGS
      #############################################

      - name: Update image tags in Kustomize overlay
        run: |
          cd k8s/overlays/$ENVIRONMENT

          if [[ "${{ needs.detect-changes.outputs.auth }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kustomize edit set image $DOCKER_REGISTRY/$IMAGE_PREFIX-auth=$DOCKER_REGISTRY/$IMAGE_PREFIX-auth:${{ steps.vars.outputs.sha_short }}
          fi

          if [[ "${{ needs.detect-changes.outputs.items }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kustomize edit set image $DOCKER_REGISTRY/$IMAGE_PREFIX-items=$DOCKER_REGISTRY/$IMAGE_PREFIX-items:${{ steps.vars.outputs.sha_short }}
          fi

          if [[ "${{ needs.detect-changes.outputs.discounts }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kustomize edit set image $DOCKER_REGISTRY/$IMAGE_PREFIX-discounts=$DOCKER_REGISTRY/$IMAGE_PREFIX-discounts:${{ steps.vars.outputs.sha_short }}
          fi

          if [[ "${{ needs.detect-changes.outputs.client }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$ENVIRONMENT" == "production" ]]; then
              kustomize edit set image $DOCKER_REGISTRY/$IMAGE_PREFIX-client=$DOCKER_REGISTRY/$IMAGE_PREFIX-client:prod-${{ steps.vars.outputs.sha_short }}
            else
              kustomize edit set image $DOCKER_REGISTRY/$IMAGE_PREFIX-client=$DOCKER_REGISTRY/$IMAGE_PREFIX-client:staging-${{ steps.vars.outputs.sha_short }}
            fi

          fi

      #############################################
      # DEPLOY
      #############################################

      - name: Deploy overlay
        run: kubectl apply -k k8s/overlays/$ENVIRONMENT

      #############################################
      # VERIFY ROLLOUT
      #############################################

      - name: Verify rollout
        run: |
          kubectl wait \
            --for=condition=available deployment \
            --all \
            -n restauranty-$ENVIRONMENT \
            --timeout=300s