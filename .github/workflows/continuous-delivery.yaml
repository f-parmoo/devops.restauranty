name: Continuous Delivery

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      items: ${{ steps.filter.outputs.items }}
      discounts: ${{ steps.filter.outputs.discounts }}
      client: ${{ steps.filter.outputs.client }}
      k8s: ${{ steps.filter.outputs.k8s }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth/**'

            items:
              - 'backend/items/**'

            discounts:
              - 'backend/discounts/**'

            client:
              - 'client/**'

            k8s:
              - 'k8s/**'
              - 'infra/**'
              - 'deploy.sh'
              - '.github/workflows/**'

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: detect-changes

    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push auth image
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t fatemehparmoo/restauranty-auth:${{ steps.vars.outputs.sha_short }} \
            -f backend/auth/Dockerfile \
            ./backend/auth \
            --push

      - name: Build and push items image
        if: needs.detect-changes.outputs.items == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t fatemehparmoo/restauranty-items:${{ steps.vars.outputs.sha_short }} \
            -f backend/items/Dockerfile \
            ./backend/items \
            --push

      - name: Build and push discounts image
        if: needs.detect-changes.outputs.discounts == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t fatemehparmoo/restauranty-discounts:${{ steps.vars.outputs.sha_short }} \
            -f backend/discounts/Dockerfile \
            ./backend/discounts \
            --push

      - name: Build and push client staging image
        if: env.ENVIRONMENT == 'staging' && (needs.detect-changes.outputs.client == 'true' || needs.detect-changes.outputs.k8s == 'true')
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg REACT_APP_SERVER_URL=https://staging.restauranty.codewithfatemeh.online \
            -t fatemehparmoo/restauranty-client:staging-${{ steps.vars.outputs.sha_short }} \
            -f client/Dockerfile \
            ./client \
            --push

      - name: Build and push client production image
        if: env.ENVIRONMENT == 'production' && (needs.detect-changes.outputs.client == 'true' || needs.detect-changes.outputs.k8s == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg REACT_APP_SERVER_URL=https://restauranty.codewithfatemeh.online \
            -t fatemehparmoo/restauranty-client:prod-${{ steps.vars.outputs.sha_short }} \
            -f client/Dockerfile \
            ./client \
            --push

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_NAME }} \
            --overwrite-existing

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Update image tags in Kustomize overlay
        run: |
          cd k8s/overlays/$ENVIRONMENT

          if [[ "${{ needs.detect-changes.outputs.auth }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kustomize edit set image fatemehparmoo/restauranty-auth=fatemehparmoo/restauranty-auth:${{ steps.vars.outputs.sha_short }}
          fi

          if [[ "${{ needs.detect-changes.outputs.items }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kustomize edit set image fatemehparmoo/restauranty-items=fatemehparmoo/restauranty-items:${{ steps.vars.outputs.sha_short }}
          fi

          if [[ "${{ needs.detect-changes.outputs.discounts }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kustomize edit set image fatemehparmoo/restauranty-discounts=fatemehparmoo/restauranty-discounts:${{ steps.vars.outputs.sha_short }}
          fi

          if [[ "${{ needs.detect-changes.outputs.client }}" == "true" || "${{ needs.detect-changes.outputs.k8s }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$ENVIRONMENT" == "production" ]]; then
              kustomize edit set image fatemehparmoo/restauranty-client=fatemehparmoo/restauranty-client:prod-${{ steps.vars.outputs.sha_short }}
            else
              kustomize edit set image fatemehparmoo/restauranty-client=fatemehparmoo/restauranty-client:staging-${{ steps.vars.outputs.sha_short }}
            fi
          fi

      - name: Deploy overlay
        run: kubectl apply -k k8s/overlays/$ENVIRONMENT

      - name: Verify rollout
        run: |
          kubectl wait \
            --for=condition=available deployment \
            --all \
            -n restauranty-$ENVIRONMENT \
            --timeout=300s