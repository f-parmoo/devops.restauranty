deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13

        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  storage_config:
    filesystem:
      directory: /var/loki/chunks

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 5Gi

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

gateway:
  enabled: true

  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production

    hosts:
      - host: loki.restauranty.codewithfatemeh.online
        paths:
          - path: /
            pathType: Prefix

    tls:
      - secretName: loki-tls
        hosts:
          - loki.restauranty.codewithfatemeh.online

monitoring:
  dashboards:
    enabled: true

  rules:
    enabled: true

  serviceMonitor:
    enabled: true
